<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicoVerse - AI Content HQ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101522;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px 7%;display:flex;
 justify-content:space-between;align-items:center;
 background:#171f30;border-bottom:1px solid #303b50;
}
.logo{font-size:24px;font-weight:bold;color:#8c9eff}
.status{color:#65e6a5;font-size:13px}
main{padding:35px 7%}
h1{font-size:32px;margin-bottom:8px}
.sub{color:#9eabc1}
.city{
 margin-top:30px;padding:25px;border-radius:18px;
 background:linear-gradient(135deg,#253b59,#17283c);
 border:1px solid #405675;
}
.city h2{margin-top:0}
.buildings{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:15px;margin-top:22px;
}
.building{
 background:#202e43;border:1px solid #455a78;
 border-radius:14px;padding:20px;
 min-height:130px;
}
.icon{font-size:32px}
.building h3{margin:10px 0 5px}
.building p{color:#aab8cc;font-size:13px}
button{
 background:#7188ff;color:white;border:0;
 padding:11px 16px;border-radius:9px;
 font-weight:bold;cursor:pointer;
}
.panel{
 margin-top:25px;background:#1a2435;
 padding:22px;border-radius:15px;
 border:1px solid #303e55;
}
.task{
 padding:13px;margin-top:12px;
 background:#26344a;border-radius:9px;
 color:#cbd5e5;
}
.task span{color:#65e6a5}
footer{padding:30px;text-align:center;color:#7e8ca3}
@media(max-width:500px){
 .buildings{grid-template-columns:1fr}
 h1{font-size:27px}
}
</style>
</head>
 <script>
function show(judul, deskripsi) {
  let panel = document.getElementById("room-panel");

  if (!panel) {
    panel = document.createElement("section");
    panel.id = "room-panel";
    panel.className = "panel";
    document.querySelector("main").appendChild(panel);
  }

  panel.innerHTML = `
    <h2>${judul}</h2>
    <p class="sub">${deskripsi}</p>
    <div class="task">
      <span>● RUANGAN AKTIF</span>
      <p>Selamat datang di ${judul} NicoVerse.</p>
    </div>
    <button onclick="document.getElementById('room-panel').remove()">
      Kembali
    </button>
  `;

  panel.scrollIntoView({ behavior: "smooth" });
}
</script>
 <body>

<header>
 <div class="logo">🌌 NicoVerse</div>
 <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

 <p class="sub">Explore More, Know More.</p>

  <h2>🏙️ Virtual Office</h2>
  <p class="sub">Selamat datang di pusat operasi NicoVerse.</p>

  <div class="buildings">
   <div class="building">
    <div class="icon">💡</div>
    <h3>Idea Lab</h3>

    <button onclick="show('Idea Lab','Tempat AI akan mengembangkan ide fakta, teknologi, sains, dan sejarah.')">Masuk</button>
   </div>

   <div class="building">
    <div class="icon">✍️</div>
    <h3>Script Studio</h3>
    <p>Tempat pen
